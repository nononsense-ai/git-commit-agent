[project]
name = "git-commit-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "kaushik" }]
requires-python = ">=3.12"
dependencies = ["openai>=3.33.0", "python-dotenv>=1.2.4"]

[project.scripts]
gcommit = "gcommit.agent:main"

[tool.uv.build-backend]
module-name = "gcommit"


[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
